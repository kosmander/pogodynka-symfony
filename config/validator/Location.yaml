App\Entity\Location:
    properties:
        city:
            - NotBlank: { message: 'City is required.', groups: ['new', 'edit'] }
        country:
            - NotBlank: { message: 'Country is required.', groups: ['new', 'edit'] }
        latitude:
            - NotBlank: { message: 'Latitude is required.', groups: ['new', 'edit'] }
            - Range: { min: -90, max: 90, notInRangeMessage: 'Latitude must be between {{ min }} and {{ max }}.', groups: ['new', 'edit'] }
        longitude:
            - NotBlank: { message: 'Longitude is required.', groups: ['new', 'edit'] }
            - Range: { min: -180, max: 180, notInRangeMessage: 'Longitude must be between {{ min }} and {{ max }}.', groups: ['new', 'edit'] }
